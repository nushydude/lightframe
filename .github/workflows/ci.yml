name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  frontend-quality:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint TypeScript and React
        run: pnpm run lint

      - name: Run Vitest suite
        run: pnpm run test:run

      - name: Build frontend
        run: pnpm run build

      - name: Fetch pull request base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Audit changed-code quality
        run: pnpm run quality:audit:ci

  rust-quality:
    name: Rust Quality Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Check Rust formatting
        run: cargo fmt -- --check
        working-directory: ./src-tauri

      - name: Lint Rust with Clippy
        run: cargo clippy -- -D warnings
        working-directory: ./src-tauri

      - name: Run Rust tests
        run: cargo test
        working-directory: ./src-tauri
