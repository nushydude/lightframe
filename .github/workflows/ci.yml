name: CI

on:
  workflow_call:
  push:
    branches: ['main', 'codex/**', 'hotfix/**', 'release/**']
  pull_request:
    branches: ['main']

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  javascript-advisory:
    name: JavaScript Dependency Advisory Gate
    # v2.3.8
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2
    with:
      scan-args: |-
        --lockfile=./pnpm-lock.yaml
      upload-sarif: false
      fail-on-vuln: true
    permissions:
      actions: read
      contents: read
      # Required by the reusable workflow's static permission contract.
      security-events: write

  rust-advisory:
    name: Rust Dependency Advisory Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Audit Cargo.lock against RustSec
        # v2.0.0
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ./src-tauri

      - name: Audit updater verifier Cargo.lock against RustSec
        # v2.0.0
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ./tools/updater-signature-verifier

  frontend-quality:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest

    steps:
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Install pnpm
        # v6
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
        with:
          version: 10.33.2

      - name: Setup Node.js
        # v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint TypeScript and React
        run: pnpm run lint

      - name: Run E2E helper tests
        run: pnpm run test:e2e-helper

      - name: Run Windows smoke helper tests
        run: node --test scripts/smoke/windows-launch-smoke.test.mjs

      - name: Run version contract tests
        run: pnpm run test:version

      - name: Run release supply-chain tests
        run: pnpm run test:release-supply-chain

      - name: Run Vitest suite
        run: pnpm run test:run

      - name: Build frontend
        run: pnpm run build

      - name: Verify version metadata and Cargo.lock
        run: pnpm run quality:version

      - name: Fetch pull request base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Fetch main audit base branch
        if: github.event_name != 'pull_request'
        run: git fetch --force origin "+refs/heads/main:refs/remotes/origin/main"

      - name: Audit changed-code quality
        run: pnpm run quality:audit:ci

  rust-quality:
    name: Rust Quality Gate
    runs-on: ubuntu-latest

    steps:
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust stable
        # stable (resolved 2026-08-04)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: clippy, rustfmt

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Check Rust formatting
        run: cargo fmt -- --check
        working-directory: ./src-tauri

      - name: Lint Rust with Clippy
        run: cargo clippy -- -D warnings
        working-directory: ./src-tauri

      - name: Run Rust tests
        run: cargo test
        working-directory: ./src-tauri

      - name: Check updater verifier formatting
        run: cargo fmt -- --check
        working-directory: ./tools/updater-signature-verifier

      - name: Lint updater verifier with locked Clippy
        run: cargo clippy --locked -- -D warnings
        working-directory: ./tools/updater-signature-verifier

      - name: Run locked updater verifier tests
        run: cargo test --locked
        working-directory: ./tools/updater-signature-verifier

  windows-packaged-startup-smoke:
    name: Windows Packaged Startup Smoke
    runs-on: windows-2025

    steps:
      # v7
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pnpm
        # v6
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996
        with:
          version: 10.33.2

      - name: Setup Node.js
        # v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: pnpm

      - name: Install Rust stable
        # stable (resolved 2026-08-04)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Windows E2E browser arguments
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $configPath = './src-tauri/tauri.conf.json'
          $config = Get-Content -Raw $configPath | ConvertFrom-Json
          foreach ($window in $config.app.windows) {
            $window | Add-Member -NotePropertyName additionalBrowserArgs -NotePropertyValue '--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection --autoplay-policy=no-user-gesture-required --remote-debugging-port=9222 --remote-allow-origins=*' -Force
          }
          $config | ConvertTo-Json -Depth 100 | Set-Content -Encoding utf8 $configPath

      - name: Build unpackaged Tauri release executable
        run: pnpm tauri build --no-bundle --ci

      - name: Smoke test packaged startup
        shell: pwsh
        run: ./scripts/smoke/windows-launch-smoke.ps1 -ExePath ./src-tauri/target/release/lightframe.exe -TimeoutSeconds 45 -WindowStablePolls 2 -RespondingGraceSeconds 5

      - name: Run Windows navigation E2E
        env:
          LIGHTFRAME_E2E_CDP_PORT: '9222'
        shell: pwsh
        run: pnpm run e2e:windows

      - name: Upload Windows E2E diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-e2e-diagnostics
          path: artifacts/windows-e2e
          if-no-files-found: warn
