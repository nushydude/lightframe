name: CI

on:
  push:
    branches: ['main', 'codex/**', 'hotfix/**', 'release/**']
  pull_request:
    branches: ['main']

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  javascript-advisory:
    name: JavaScript Dependency Advisory Gate
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --lockfile=./pnpm-lock.yaml
      upload-sarif: false
      fail-on-vuln: true
    permissions:
      actions: read
      contents: read
      # Required by the reusable workflow's static permission contract.
      security-events: write

  rust-advisory:
    name: Rust Dependency Advisory Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v7

      - name: Audit Cargo.lock against RustSec
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ./src-tauri
          # little_exif 0.6.23 pins quick-xml 0.37; tracked for replacement in #101.
          ignore: RUSTSEC-2026-0194,RUSTSEC-2026-0195

  frontend-quality:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint TypeScript and React
        run: pnpm run lint

      - name: Run Vitest suite
        run: pnpm run test:run

      - name: Build frontend
        run: pnpm run build

      - name: Fetch pull request base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Fetch main audit base branch
        if: github.event_name != 'pull_request'
        run: git fetch --force origin "+refs/heads/main:refs/remotes/origin/main"

      - name: Audit changed-code quality
        run: pnpm run quality:audit:ci

  rust-quality:
    name: Rust Quality Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Check Rust formatting
        run: cargo fmt -- --check
        working-directory: ./src-tauri

      - name: Lint Rust with Clippy
        run: cargo clippy -- -D warnings
        working-directory: ./src-tauri

      - name: Run Rust tests
        run: cargo test
        working-directory: ./src-tauri

  windows-packaged-startup-smoke:
    name: Windows Packaged Startup Smoke
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unpackaged Tauri release executable
        run: pnpm tauri build --no-bundle --ci

      - name: Smoke test packaged startup
        shell: pwsh
        run: ./scripts/smoke/windows-launch-smoke.ps1 -ExePath ./src-tauri/target/release/lightframe.exe
